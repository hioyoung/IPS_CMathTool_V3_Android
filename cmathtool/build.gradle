plugins {
    id 'com.android.library'
}

android {
    compileSdk 36

    defaultConfig {
        minSdkVersion 24
//        targetSdkVersion 31

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
        ndk {
            moduleName "CMathTool"
            abiFilters 'arm64-v8a', 'armeabi-v7a','x86', 'x86_64'//, 'armeabi'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    externalNativeBuild {
        ndkBuild {
            path 'src/main/jni/Android.mk'
        }
    }
    sourceSets {
        main {
            java.srcDirs = ['src/main/java', 'src/main/aidl', 'src/main/jni']
            res.srcDirs = ['src/main/res']
        }
    }
    namespace 'com.ijali.cmathtool'
    buildToolsVersion '36.1.0'
    ndkVersion '30.0.16248370'   // IPS_Engine_V3_Android 와 같은 NDK (29 rc4 는 설치·배포되지 않음)
}

dependencies {

    implementation 'androidx.appcompat:appcompat:1.4.0'
    implementation 'com.google.android.material:material:1.4.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'
}

repositories {
    mavenCentral()
}

afterEvaluate {
    // IPS_Engine_V3_Android 는 CMathTool 을 소스로 정적 링크한다 (prebuilt .so 를 쓰지 않음).
    // 여기서 만든 .so 는 OutputLib 에만 둔다 (엔진 jni/jniLibs 로 복사하지 않음).
    def ppsDir = layout.projectDirectory.dir("../../IPS_Engine_V3_Android/ipsengine/src/main/jni/IPSEngine/PPS")
    def outputLibDir = layout.projectDirectory.dir("../OutputLib")

    ['debug', 'release'].each { buildType ->
        def variantName = buildType.capitalize()
        def stripTaskName = "strip${variantName}DebugSymbols"
        def libSrcDir = layout.buildDirectory.dir("intermediates/stripped_native_libs/${buildType}/${stripTaskName}/out/lib")

        // debug 빌드: libCMathToolDebug.so, release 빌드: libCMathTool.so 로 OutputLib에 저장
        def copyToOutputLibTask = tasks.register("copy${variantName}NativeLibs", Copy) {
            from(libSrcDir)
            into(outputLibDir)
            include("**/*.so")
            if (buildType == 'debug') {
                rename 'libCMathTool\\.so', 'libCMathToolDebug.so'
            }
        }

        def copyHeaderToPPSTask = tasks.register("copy${variantName}CMathToolHeaderToPPS", Copy) {
            from(layout.projectDirectory.file("src/main/jni/CMathTool/CMathTool.h"))
            into(ppsDir)
        }

        tasks.matching { it.name == "assemble${variantName}" }.configureEach {
            finalizedBy(copyToOutputLibTask, copyHeaderToPPSTask)
        }
    }
}